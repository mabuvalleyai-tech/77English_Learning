<title>拍照單字卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one narrow column like a phone notebook; the flashcard is the hero, marker-yellow highlights echo the textbook's colored example words. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F6F8FC; --ink:#1B2A4A; --muted:#5D6B85; --line:#D8DFEB;
  --accent:#2D5BD8; --accent-ink:#FFFFFF; --marker:#FFE36E; --marker-ink:#1B2A4A;
  --good:#1D8F63; --again:#D9622B; --danger:#C2373A;
  --f-display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ipa:"Noto Sans","Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172038; --surface2:#1D2843; --ink:#E7ECF6; --muted:#9AA6BF; --line:#2B3756;
  --accent:#7FA3FF; --accent-ink:#0E1424; --marker:#6E5C10; --marker-ink:#FFF4C2;
  --good:#45C08E; --again:#F08A57; --danger:#F07073; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172038; --surface2:#1D2843; --ink:#E7ECF6; --muted:#9AA6BF; --line:#2B3756;
  --accent:#7FA3FF; --accent-ink:#0E1424; --marker:#6E5C10; --marker-ink:#FFF4C2;
  --good:#45C08E; --again:#F08A57; --danger:#F07073; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--marker);display:grid;place-items:center;color:var(--marker-ink);font-size:16px}
.ver{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero-cta{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.hero-cta .big{font-size:18px;min-height:56px}
.deck{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.deck-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.deck-title{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.meter{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:999px}
.deck .row button{flex:1 1 0;min-width:72px}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:340px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;box-shadow:0 10px 30px -18px rgba(20,40,90,.45)}
.card.flip{animation:flip .28s ease}
@keyframes flip{0%{transform:rotateY(70deg);opacity:.3}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--ink);background:none;border:0;padding:6px 10px;border-radius:12px;overflow-wrap:anywhere;min-height:0}
.word:active,.word.speaking{background:var(--marker);color:var(--marker-ink)}
.ipa{font-family:var(--f-ipa);font-size:18px;color:var(--muted)}
.pos{font-style:italic;color:var(--muted);font-size:15px}
.zh{font-size:clamp(24px,7vw,32px);font-weight:700}
.zh.front{font-size:clamp(28px,9vw,40px)}
.ex{font-size:17px;line-height:1.6;text-align:left;background:var(--surface2);border-radius:12px;padding:12px 14px;width:100%;border:0;color:var(--ink);display:block}
.ex mark{background:var(--marker);color:var(--marker-ink);border-radius:4px;padding:0 3px}
.ex .hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.speak{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px}
.progress{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.progress .meter{flex:1}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer button{min-height:56px;font-weight:700;font-size:17px}
.answer .again{color:var(--again);border-color:var(--again)}
.answer .good{color:var(--good);border-color:var(--good)}
.flipbtn{width:100%;min-height:56px;font-size:17px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* list */
.wl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wl .it{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.wl .it:first-child{border-top:0}
.wl .it .speak{width:40px;height:40px;font-size:18px}
.wl .en{font-family:var(--f-display);font-weight:600;font-size:20px}
.wl .known{color:var(--good);font-size:13px;margin-left:6px}
/* scan + edit */
.drop{border:2px dashed var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;width:100%}
.thumbs div{position:relative}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:4px;right:4px;min-height:28px;width:28px;padding:0;border-radius:50%;font-size:14px}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ed{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ed .g{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.ed .g3{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.ed .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface2)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px}
.notice.err{color:var(--danger)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.done .score{font-family:var(--f-display);font-size:44px;font-weight:700}
.settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
</style>

<div class="wrap" id="app">
  <header>
    <button class="brand" id="homeBtn" aria-label="回到首頁"><span class="dot">Aa</span>拍照單字卡</button>
    <span class="ver" id="verTag">v1.0</span>
  </header>
  <main id="view"><div class="status"><div class="spin"></div>載入中…</div></main>
  <details id="changelog">
    <summary>版本紀錄</summary>
    <ul id="clList"></ul>
  </details>
</div>

<script>
const VERSION = "v1.0";
const CHANGELOG = [
  ["v1.0","2026-11-22","第一版：拍課本單字頁自動變成單字卡、點英文唸發音、翻卡練習（記住了／還不熟）、單字表、手動編輯、內建 Lesson 5 範例"],
];

/* ---------- demo deck (transcribed from the sample textbook photo) ---------- */
const DEMO = {id:"demo",title:"範例：Lesson 5 單字（p.129）",demo:true,cards:[
 ["tour","n.","旅遊行程","[tʊr]","We plan to join the local tour in Bangkok.","tour"],
 ["spend / spent","v.","花費（金錢；時間）","[spɛnd] / [spɛnt]","Maggie spent half an hour walking to the bakery.","spent"],
 ["thousand","n.","千","[ˋθaʊzn̩d；ˋθaʊzənd]","Ivy spent two thousand NT dollars on the coat.","thousand"],
 ["each","adj.; pron.","每個（的）","[itʃ]","Each child can get a toy car for free.","Each"],
 ["pay / paid","v.","付錢","[pe] / [ped]","I paid one thousand NT dollars for this cellphone.","paid"],
 ["tomorrow","adv.; n.","明天","[təˋmɑro；təˋmɔro]","Mandy and I are going to visit Mr. Jones tomorrow.","tomorrow"],
 ["almost","adv.","幾乎","[ˋɔl͵most]","It was almost two o'clock when Eric left.","almost"],
 ["decide","v.","決定","[dɪˋsaɪd]","It was raining then, so we decided to stay at the hotel.","decided"],
 ["cost / cost","v.","花費（金錢）","[kɔst]","It cost me five thousand NT dollars to buy the guitar.","cost"],
 ["fan","n.","……迷；電扇","[fæn]","Terry is a big fan of baseball.","fan"],
 ["leave for","phr.","前往","[ˋliv fɔr]","Jenny and Paul are going to leave for Tokyo tomorrow.","leave for"],
 ["vendor","n.","攤販","[ˋvɛndɚ]","There are some flower vendors outside the temple.","vendors"],
 ["quick","adj.","迅速的","[kwɪk]","I tried to catch her, but she was too quick for me.","quick"],
 ["stall","n.","攤位","[stɔl]","Jason runs a fruit stall in the market.","stall"],
 ["careful","adj.","小心的","[ˋkɛrfəl]","Be careful! There is a car behind you.","careful"],
 ["boat","n.","小船","[bot]","Mr. Simpson has two fishing boats.","boats"],
 ["sell / sold","v.","賣；出售","[sɛl] / [sold]","I sold my bag to Jamie for NT$100.","sold"],
 ["low","adj.","低的；矮的","[lo]","Our office is in a low building.","low"],
 ["price","n.","價格；代價","[praɪs]","Bill sold his house at a high price.","price"],
 ["remember","v.","記得","[rɪˋmɛmbɚ]","Remember to send me a message when you get home.","Remember"],
 ["cash","n.","現金","[kæʃ]","Do you have any cash on you?","cash"],
 ["wonderful","adj.","美好的","[ˋwʌndɚfəl]","We had a wonderful time in Penghu this summer.","wonderful"],
].map(([en,pos,zh,ipa,example,hl],i)=>({id:"d"+i,en,pos,zh,ipa,example,hl,known:false}))};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} };
function markEx(ex,hl){
  const t = esc(ex); if(!hl) return t;
  const h = esc(hl).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  try{ return t.replace(new RegExp("\\b("+h+")\\b","i"),"<mark>$1</mark>") }catch(e){ return t }
}

/* ---------- speech (browser built-in, works on iPhone/Android/PC) ---------- */
const prefs = Object.assign({rate:0.85, autoSpeak:true}, lsGet("wc_prefs",{}));
let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, el, rate){
  if(!("speechSynthesis" in window)){ toast("這台裝置的瀏覽器不支援朗讀"); return; }
  const say = String(text).replace(/\s*\/\s*/g,", ").replace(/……|\.\.\./g," ");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.lang = "en-US"; if(voice) u.voice = voice; u.rate = rate || prefs.rate;
  if(el){ el.classList.add("speaking"); u.onend = u.onerror = () => el.classList.remove("speaking"); }
  speechSynthesis.speak(u);
}
let toastT;
function toast(msg){
  let t = $("#toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status");
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw";
    document.body.appendChild(t); }
  t.textContent = msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200);
}

/* ---------- storage: Claude 雲端（跟著帳號走）→ 失敗時用本機 ---------- */
let db=null, userId=null, sample=null, sampleImages=false;
const store = {
  mode:"local",
  async load(){
    if(db && userId){
      try{
        const snap = await db.collection("data/users/"+userId+"/decks").get();
        this.mode="cloud";
        return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      }catch(e){ console.warn("db load failed",e); }
    }
    this.mode="local";
    return lsGet("wc_decks",[]);
  },
  queue:Promise.resolve(),
  save(deck){
    if(deck.demo){ lsSet("wc_demo_known", deck.cards.filter(c=>c.known).map(c=>c.id)); return; }
    deck.updatedAt = Date.now();
    if(this.mode==="cloud"){
      const {id,...body} = deck;
      this.queue = this.queue.then(()=>db.doc("data/users/"+userId+"/decks/"+id).set(JSON.parse(JSON.stringify(body)))).catch(e=>{console.warn(e);toast("儲存失敗，請稍後再試")});
    } else lsSet("wc_decks", state.decks);
  },
  remove(id){
    if(this.mode==="cloud") this.queue = this.queue.then(()=>db.doc("data/users/"+userId+"/decks/"+id).delete()).catch(e=>console.warn(e));
    else lsSet("wc_decks", state.decks);
  }
};

/* ---------- state ---------- */
const state = { decks:[], demo:DEMO, view:"home" };
(function(){ const k = lsGet("wc_demo_known",[]); DEMO.cards.forEach(c=>c.known=k.includes(c.id)); })();
const allDecks = () => [...state.decks, state.demo];
const findDeck = id => allDecks().find(d=>d.id===id);
let saveT=null;
function saveSoon(deck){ clearTimeout(saveT); saveT=setTimeout(()=>store.save(deck),700); }

/* ---------- views ---------- */
function go(view, arg){ state.view=view; state.arg=arg; render(); window.scrollTo(0,0); }
function render(){
  const v=$("#view");
  if(state.view==="home") return renderHome(v);
  if(state.view==="scan") return renderScan(v);
  if(state.view==="edit") return renderEdit(v);
  if(state.view==="study") return renderStudy(v);
  if(state.view==="list") return renderList(v);
}

function renderHome(v){
  const decks = allDecks();
  v.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="hero-cta">
      <h1 style="font-size:24px">把課本單字頁拍下來，就變成單字卡</h1>
      <p class="muted small">拍一頁課本的單字表（英文、詞性、中文、音標、例句），Claude 會幫你整理好。點英文就會唸出來。</p>
      <button class="primary big" id="newScan">📷 拍照新增單字</button>
      <button class="ghost small" id="newManual">或自己打字建立一組</button>
    </div>
    ${store.mode==="local" ? `<p class="notice small">目前單字卡只存在這個瀏覽器裡。</p>` : ``}
    <h2>我的單字卡</h2>
    ${decks.map(d=>{
      const n=d.cards.length, k=d.cards.filter(c=>c.known).length;
      return `<div class="deck" data-id="${esc(d.id)}">
        <div class="deck-top"><span class="deck-title">${esc(d.title)}</span><span class="tag">${k}/${n} 記住了</span></div>
        <div class="meter"><i style="width:${n?Math.round(k/n*100):0}%"></i></div>
        <div class="row">
          <button class="primary" data-act="study">練習</button>
          <button data-act="list">單字表</button>
          ${d.demo?``:`<button data-act="edit">編輯</button><button class="ghost danger" data-act="del" aria-label="刪除">刪除</button>`}
        </div>
        <div class="confirm" hidden>確定刪除「${esc(d.title)}」？<button class="danger" data-act="del-yes">刪除</button><button data-act="del-no">取消</button></div>
      </div>`}).join("")}
    <div class="settings">
      <span>發音速度</span>
      <button class="chip" data-rate="0.65" aria-pressed="${prefs.rate===0.65}">慢</button>
      <button class="chip" data-rate="0.85" aria-pressed="${prefs.rate===0.85}">正常</button>
      <button class="chip" data-rate="1" aria-pressed="${prefs.rate===1}">快</button>
      <button class="chip" id="testVoice">🔊 試聽</button>
    </div>
  </div>`;
  $("#newScan").onclick=()=>go("scan");
  $("#newManual").onclick=()=>go("edit",{id:null,title:"",cards:[{id:uid(),en:"",pos:"",zh:"",ipa:"",example:"",hl:"",known:false}],fresh:true});
  v.querySelectorAll(".deck").forEach(el=>{
    const d=findDeck(el.dataset.id);
    el.onclick=e=>{
      const a=e.target.closest("[data-act]")?.dataset.act; if(!a) return;
      if(a==="study") go("study",{id:d.id});
      if(a==="list") go("list",{id:d.id});
      if(a==="edit") go("edit",{...JSON.parse(JSON.stringify(d))});
      if(a==="del") el.querySelector(".confirm").hidden=false;
      if(a==="del-no") el.querySelector(".confirm").hidden=true;
      if(a==="del-yes"){ state.decks=state.decks.filter(x=>x.id!==d.id); store.remove(d.id); render(); toast("已刪除"); }
    };
  });
  v.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{prefs.rate=+b.dataset.rate; lsSet("wc_prefs",prefs); render(); speak("wonderful");});
  $("#testVoice").onclick=()=>speak("Hello! Let's learn some new words.");
}

/* ---------- scan ---------- */
let scanFiles=[]; let scanCtl=null;
function renderScan(v){
  const canAI = !!(sample && sampleImages);
  v.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="row"><button class="ghost" id="back">← 返回</button></div>
    <h2>拍照新增單字</h2>
    ${canAI?``:`<p class="notice err">這裡無法使用照片辨識（需要在 Claude 的網頁或 App 中開啟這個頁面並允許使用 Claude）。你仍然可以<button class="ghost" id="toManual" style="padding:0 4px;min-height:0;color:var(--accent)">自己打字建立</button>。</p>`}
    <div class="drop">
      <p><b>拍一頁或選幾張課本單字頁的照片</b></p>
      <p class="muted small">小提醒：拍正、光線充足、整頁單字都在畫面裡，辨識會最準。</p>
      <label class="btn primary" for="pick">📷 拍照 / 選照片</label>
      <input id="pick" type="file" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <label class="f">這組單字的名字（可空白，會自動取名）<input type="text" id="deckName" placeholder="例如：Lesson 5 單字"></label>
    <button class="primary" id="go" style="min-height:52px" ${scanFiles.length&&canAI?"":"disabled"}>開始辨識</button>
    <div id="scanStatus"></div>
  </div>`;
  $("#back").onclick=()=>{scanCtl?.abort(); go("home")};
  $("#toManual") && ($("#toManual").onclick=()=>go("edit",{id:null,title:"",cards:[{id:uid(),en:"",pos:"",zh:"",ipa:"",example:"",hl:"",known:false}],fresh:true}));
  const th=$("#thumbs");
  const drawThumbs=()=>{
    th.innerHTML=scanFiles.map((f,i)=>`<div><img alt="照片 ${i+1}" src="${f.url}"><button data-i="${i}" aria-label="移除照片">✕</button></div>`).join("");
    th.querySelectorAll("button").forEach(b=>b.onclick=()=>{URL.revokeObjectURL(scanFiles[+b.dataset.i].url);scanFiles.splice(+b.dataset.i,1);drawThumbs();$("#go").disabled=!scanFiles.length||!canAI;});
  };
  drawThumbs();
  $("#pick").onchange=e=>{
    for(const f of e.target.files) scanFiles.push({file:f,url:URL.createObjectURL(f)});
    e.target.value=""; drawThumbs(); $("#go").disabled=!scanFiles.length||!canAI;
  };
  $("#go").onclick=runScan;
}

async function shrink(file){
  const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const max=2000, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
}

const PROMPT = `這是一張台灣國中英語課本「單字表」頁面的照片。請把頁面上每一個單字條目整理成 JSON。

每個條目通常有：編號、英文單字（可能有變化形，例如 "spend / spent"）、詞性縮寫（n. v. adj. adv. pron. prep. 等）、繁體中文意思、KK 音標（在方括號裡）、一句英文例句（例句中該單字常以不同顏色標示）。

規則：
- en：照課本原樣，保留 " / " 的變化形。片語（如 "leave for"）也算一個條目。
- pos：照課本的詞性縮寫；片語沒有詞性就填 "phr."。
- zh：照課本的繁體中文意思，不要自己翻譯。
- ipa：照課本音標原樣，含方括號，例如 "[spɛnd] / [spɛnt]"。看不清楚就填空字串。
- example：完整英文例句。若有兩句，只取第一句。若被手指或頁緣遮住一小段，依上下文補上最可能的字。
- hl：例句中對應這個單字的那個字（照例句裡的寫法，例如 "spent"、"boats"）。
- 只收這一頁主要的單字條目，依編號順序；忽略照片邊緣被切掉的隔壁頁。
- title：若看得到課名或頁碼，寫成像 "Lesson 5 單字（p.129）"；看不到就寫 "新的單字"。

只回傳 JSON，不要其他文字，格式：
{"title":"...","cards":[{"en":"","pos":"","zh":"","ipa":"","example":"","hl":""}]}`;

async function runScan(){
  const st=$("#scanStatus"), btn=$("#go");
  btn.disabled=true; scanCtl=new AbortController();
  const found=[]; let title="";
  try{
    for(let i=0;i<scanFiles.length;i++){
      st.innerHTML=`<div class="status"><div class="spin"></div><div class="grow">Claude 正在讀第 ${i+1}/${scanFiles.length} 張照片…（通常要 20–60 秒）</div><button id="stopScan">停止</button></div>`;
      $("#stopScan").onclick=()=>scanCtl.abort();
      const blob=await shrink(scanFiles[i].file);
      const out=await sample.json(PROMPT,{images:[blob],signal:scanCtl.signal,modelTier:"default"});
      if(out && Array.isArray(out.cards)){
        if(!title && out.title && out.title!=="新的單字") title=out.title;
        for(const c of out.cards){
          if(!c || !String(c.en||"").trim()) continue;
          if(found.some(x=>x.en.toLowerCase()===String(c.en).trim().toLowerCase())) continue;
          found.push({id:uid(),en:String(c.en).trim(),pos:String(c.pos||""),zh:String(c.zh||""),ipa:String(c.ipa||""),example:String(c.example||""),hl:String(c.hl||""),known:false});
        }
      }
    }
    if(!found.length){ st.innerHTML=`<p class="notice err">照片裡沒有找到單字。請換一張更清楚、拍正的照片再試一次。</p>`; btn.disabled=false; return; }
    scanFiles.forEach(f=>URL.revokeObjectURL(f.url)); scanFiles=[];
    const name=$("#deckName").value.trim()||title||"新的單字";
    go("edit",{id:null,title:name,cards:found,fresh:true,fromScan:true});
  }catch(e){
    const msg={cancelled:"已停止辨識。",not_granted:"需要允許這個頁面使用 Claude 才能辨識照片。",rate_limited:"使用太頻繁了，請等一下再試。",images_unavailable:"這裡無法傳送照片給 Claude。"}[e?.code]
      || (e instanceof SyntaxError ? "Claude 回傳的格式不對，請再試一次。" : "辨識失敗，請再試一次。");
    st.innerHTML=`<p class="notice err">${esc(msg)}</p>`; btn.disabled=false;
  }
}

/* ---------- edit ---------- */
function renderEdit(v){
  const d=state.arg;
  v.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="row"><button class="ghost" id="back">← 返回</button></div>
    <h2>${d.fromScan?`找到 ${d.cards.length} 個單字，請檢查一下`:(d.fresh?"建立單字卡":"編輯單字卡")}</h2>
    ${d.fromScan?`<p class="muted small">辨識可能會有小錯，對照課本看一下，有錯直接改。</p>`:``}
    <label class="f">名稱<input type="text" id="edTitle" value="${esc(d.title)}" placeholder="例如：Lesson 5 單字"></label>
    <div id="edList" style="display:flex;flex-direction:column;gap:10px"></div>
    <button id="addRow">＋ 新增一個單字</button>
    <div class="row end"><button class="ghost" id="cancel">取消</button><button class="primary" id="save" style="min-width:140px">儲存</button></div>
    <div id="edMsg"></div>
  </div>`;
  const list=$("#edList");
  const draw=()=>{
    list.innerHTML=d.cards.map((c,i)=>`
      <div class="ed" data-i="${i}">
        <div class="row"><span class="num grow">#${i+1}</span><button class="ghost" data-sp aria-label="唸出來">🔊</button><button class="ghost danger" data-rm aria-label="刪除這個單字">刪除</button></div>
        <div class="g"><label class="f">英文<input type="text" data-k="en" value="${esc(c.en)}"></label><label class="f">詞性<input type="text" data-k="pos" value="${esc(c.pos)}"></label></div>
        <div class="g3"><label class="f">中文<input type="text" data-k="zh" value="${esc(c.zh)}"></label><label class="f">音標<input type="text" data-k="ipa" value="${esc(c.ipa)}" style="font-family:var(--f-ipa)"></label></div>
        <label class="f">例句<textarea data-k="example" rows="2">${esc(c.example)}</textarea></label>
      </div>`).join("");
  };
  draw();
  list.oninput=e=>{const k=e.target.dataset.k; if(!k) return; const i=+e.target.closest(".ed").dataset.i; d.cards[i][k]=e.target.value; if(k==="en"||k==="example"){ if(!d.cards[i].hl || !new RegExp("\\b"+d.cards[i].hl.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(d.cards[i].example)) d.cards[i].hl=d.cards[i].en.split("/")[0].trim(); }};
  list.onclick=e=>{const ed=e.target.closest(".ed"); if(!ed) return; const i=+ed.dataset.i;
    if(e.target.closest("[data-rm]")){ d.cards.splice(i,1); draw(); }
    if(e.target.closest("[data-sp]")) speak(d.cards[i].en, e.target.closest("button"));
  };
  $("#addRow").onclick=()=>{d.cards.push({id:uid(),en:"",pos:"",zh:"",ipa:"",example:"",hl:"",known:false}); draw(); list.lastElementChild.querySelector("input").focus();};
  const leave=()=>go("home");
  $("#back").onclick=leave; $("#cancel").onclick=leave;
  $("#save").onclick=()=>{
    d.cards=d.cards.filter(c=>c.en.trim()||c.zh.trim());
    if(!d.cards.length){ $("#edMsg").innerHTML=`<p class="notice err">至少要有一個單字。</p>`; return; }
    const title=$("#edTitle").value.trim()||"新的單字";
    let deck;
    if(d.id){ deck=state.decks.find(x=>x.id===d.id); Object.assign(deck,{title,cards:d.cards}); }
    else { deck={id:uid(),title,cards:d.cards,createdAt:Date.now()}; state.decks.unshift(deck); }
    store.save(deck); toast("已儲存"); go("study",{id:deck.id});
  };
}

/* ---------- study ---------- */
const sp = Object.assign({mode:"en", shuffle:false, onlyNew:false}, lsGet("wc_study",{}));
function renderStudy(v){
  const deck=findDeck(state.arg.id); if(!deck) return go("home");
  if(!state.arg.order){
    let pool=deck.cards.map((c,i)=>i);
    if(sp.onlyNew){ const p=pool.filter(i=>!deck.cards[i].known); if(p.length) pool=p; }
    if(sp.shuffle) for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    Object.assign(state.arg,{order:pool,pos:0,flipped:false,good:0,again:0});
  }
  const a=state.arg;
  if(a.pos>=a.order.length){
    const k=deck.cards.filter(c=>c.known).length;
    v.innerHTML=`<div class="panel done">
      <div class="score">🎉 ${a.good}/${a.order.length}</div>
      <p>這一輪記住了 ${a.good} 個，還不熟 ${a.again} 個。整組已經記住 ${k}/${deck.cards.length} 個。</p>
      <div class="row" style="justify-content:center">
        ${a.again?`<button class="primary" id="againNew">只練還不熟的</button>`:``}
        <button id="again">全部再練一次</button><button class="ghost" id="home2">回首頁</button>
      </div></div>`;
    $("#again").onclick=()=>{sp.onlyNew=false;lsSet("wc_study",sp);go("study",{id:deck.id});};
    $("#againNew")&&($("#againNew").onclick=()=>{sp.onlyNew=true;lsSet("wc_study",sp);go("study",{id:deck.id});});
    $("#home2").onclick=()=>go("home");
    return;
  }
  const c=deck.cards[a.order[a.pos]];
  const front = sp.mode==="en"
    ? `<button class="word" id="w">${esc(c.en)}</button>${c.ipa?`<div class="ipa">${esc(c.ipa)}</div>`:``}<p class="muted small">點英文聽發音</p>`
    : `<div class="zh front">${esc(c.zh)}</div>${c.pos?`<div class="pos">${esc(c.pos)}</div>`:``}<p class="muted small">想想看英文怎麼說？</p>`;
  const back = `<button class="word" id="w">${esc(c.en)}</button>
      ${c.ipa?`<div class="ipa">${esc(c.ipa)}</div>`:``}
      <div><span class="pos">${esc(c.pos)}</span> <span class="zh">${esc(c.zh)}</span></div>
      ${c.example?`<button class="ex" id="exb">${markEx(c.example,c.hl||c.en.split("/")[0].trim())}<span class="hint">🔊 點例句聽整句</span></button>`:``}`;
  v.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="row"><button class="ghost" id="back">← ${esc(deck.title)}</button></div>
    <div class="progress"><span class="small muted">${a.pos+1}/${a.order.length}</span><div class="meter"><i style="width:${Math.round(a.pos/a.order.length*100)}%;background:var(--accent)"></i></div></div>
    <div class="card ${a.anim?"flip":""}" id="card">${a.flipped?back:front}</div>
    ${a.flipped
      ? `<div class="answer"><button class="again" id="no">還不熟</button><button class="good" id="yes">記住了 ✓</button></div>`
      : `<button class="primary flipbtn" id="flip">翻面看答案</button>`}
    <div class="opts">
      <button class="chip" id="mEn" aria-pressed="${sp.mode==="en"}">看英文猜中文</button>
      <button class="chip" id="mZh" aria-pressed="${sp.mode==="zh"}">看中文想英文</button>
      <button class="chip" id="shuf" aria-pressed="${sp.shuffle}">隨機順序</button>
      <button class="chip" id="auto" aria-pressed="${prefs.autoSpeak}">自動發音</button>
    </div>
  </div>`;
  a.anim=false;
  $("#back").onclick=()=>go("home");
  $("#w") && ($("#w").onclick=e=>speak(c.en,e.currentTarget));
  $("#exb") && ($("#exb").onclick=()=>speak(c.example,null,Math.max(0.7,prefs.rate)));
  const next=(known)=>{
    c.known=known; known?a.good++:a.again++; a.pos++; a.flipped=false; a.anim=true;
    saveSoon(deck); render();
  };
  if(a.flipped){ $("#no").onclick=()=>next(false); $("#yes").onclick=()=>next(true); }
  else $("#flip").onclick=()=>{a.flipped=true;a.anim=true;render(); if(prefs.autoSpeak && sp.mode==="zh") speak(c.en,$("#w"));};
  const reset=()=>{delete a.order; render();};
  $("#mEn").onclick=()=>{sp.mode="en";lsSet("wc_study",sp);reset();};
  $("#mZh").onclick=()=>{sp.mode="zh";lsSet("wc_study",sp);reset();};
  $("#shuf").onclick=()=>{sp.shuffle=!sp.shuffle;lsSet("wc_study",sp);reset();};
  $("#auto").onclick=()=>{prefs.autoSpeak=!prefs.autoSpeak;lsSet("wc_prefs",prefs);render();};
  if(!a.flipped && sp.mode==="en" && prefs.autoSpeak && a.pos>0) speak(c.en,$("#w"));
}

(async function boot(){
  if(window.claude?.use){
    const timeout = new Promise(r=>setTimeout(()=>r(null),10000));
    const [s,d,u] = await Promise.all(["sample","db","user"].map(n=>Promise.race([window.claude.use(n).catch(()=>null),timeout])));
    sample=s; db=d;
    if(u){ try{ userId=await u.id(); }catch(e){} }
    if(sample){ try{ const lim=await sample.limits(); sampleImages=!!lim?.images; }catch(e){} }
  }
  state.decks = await store.load();
  render();
})();
