<title>拍照單字卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Oswald:wght@400;500&display=swap">
<style>
/* Layout: airy white page, serif (明朝) headings with small eyebrow labels and hairline rules, green pill buttons; cards are big rounded white panels. One column for phones. */
:root{
  --bg:#FFFFFF; --soft:#F3F4F2; --card:#FFFFFF; --ink:rgba(0,0,0,.82); --ink-solid:#222; --muted:#7A7A7A; --line:#DDDDDD;
  --green:#16B168; --green-ink:#FFFFFF; --green-soft:#E6F6EE;
  --marker:#D9F2E5; --marker-ink:#0F5E3A; --good:#16B168; --again:#C8742E; --danger:#C23A3A;
  --shadow:0 2px 6px rgba(0,0,0,.04),0 16px 36px -18px rgba(0,0,0,.28);
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-en:"Andika","Segoe UI","Helvetica Neue",sans-serif;
  --f-num:"Oswald","Andika",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141615; --soft:#1C1F1D; --card:#1F2321; --ink:rgba(255,255,255,.88); --ink-solid:#EEE; --muted:#9A9F9C; --line:#333836;
  --green:#3CCB86; --green-ink:#0C1A12; --green-soft:#183326;
  --marker:#1F4A34; --marker-ink:#CFF5E0; --good:#3CCB86; --again:#E39A5C; --danger:#EF7C7C;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --soft:#1C1F1D; --card:#1F2321; --ink:rgba(255,255,255,.88); --ink-solid:#EEE; --muted:#9A9F9C; --line:#333836;
  --green:#3CCB86; --green-ink:#0C1A12; --green-soft:#183326;
  --marker:#1F4A34; --marker-ink:#CFF5E0; --good:#3CCB86; --again:#E39A5C; --danger:#EF7C7C;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;letter-spacing:.02em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-serif);font-weight:700;font-size:20px;background:none;border:0;color:var(--ink-solid);padding:0;cursor:pointer;letter-spacing:.08em;display:flex;align-items:center;gap:10px;min-height:0}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--f-en);font-size:14px;letter-spacing:0}
.ver{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--f-num);letter-spacing:.08em}
h1,h2{margin:0;text-wrap:balance;font-family:var(--f-serif);font-weight:700;color:var(--ink-solid);letter-spacing:.06em}
h1{font-size:clamp(25px,7vw,30px);line-height:1.5}
h2{font-size:21px;line-height:1.5}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.14em}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted)}
button,.btn{font:inherit;letter-spacing:.04em;cursor:pointer;border-radius:999px;border:1px solid var(--ink-solid);background:var(--card);color:var(--ink-solid);padding:9px 20px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within,.fc:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.primary{background:var(--green)!important;color:var(--green-ink)!important;border-color:var(--green)!important;font-weight:700}
button.outline-green{border-color:var(--green);color:var(--green)}
button.text{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* home */
.intro{padding:28px 22px 24px;display:flex;flex-direction:column;gap:14px;border-radius:32px;background:var(--soft)}
.intro .lead{color:var(--ink)}
.intro .big{min-height:54px;font-size:16px}
.stat{display:flex;align-items:baseline;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.stat b{font-family:var(--f-num);font-weight:500;font-size:40px;line-height:1;color:var(--ink-solid);letter-spacing:0}
.decks{display:flex;flex-direction:column;gap:14px}
.deck{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);box-shadow:none}
.deck-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.deck-title{font-family:var(--f-serif);font-weight:700;font-size:18px;color:var(--ink-solid);min-width:0;overflow-wrap:anywhere}
.count{font-family:var(--f-num);font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.count b{font-size:24px;font-weight:500;color:var(--green)}
.bar{height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.deck .row button{flex:1 1 0;min-width:84px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:4px 14px;font-size:14px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink-solid);color:var(--bg)}

/* ---- flip card ---- */
.fc{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:24px}
.fc-in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative;display:flex;flex-direction:column;border-radius:24px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}
.corner{position:absolute;top:14px;left:18px;font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.turn{position:absolute;bottom:12px;right:18px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.known{position:absolute;top:12px;right:16px;font-size:12px;color:var(--green);background:var(--green-soft);padding:0 10px;border-radius:999px}
.big-card .face{min-height:390px}
.front{align-items:center;justify-content:center;gap:10px;padding:44px 20px;text-align:center}
.en{font-family:var(--f-en);font-weight:700;font-size:clamp(38px,11vw,56px);line-height:1.15;color:var(--ink-solid);overflow-wrap:anywhere;padding:2px 10px;border-radius:12px;letter-spacing:0}
.kk{font-family:var(--f-en);font-size:20px;color:var(--muted);letter-spacing:0}
.say{width:52px;height:52px;border-radius:50%;padding:0;border-color:var(--green);color:var(--green);margin-top:8px;background:var(--card)}
.say svg.i{width:24px;height:24px}
.say.speaking{background:var(--green);color:var(--green-ink)}
.back{padding:22px 22px 40px;gap:14px}
.back .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.back .head .w{font-family:var(--f-en);font-weight:700;font-size:20px;color:var(--ink-solid);overflow-wrap:anywhere;min-width:0;letter-spacing:0}
.back .head .say{width:40px;height:40px;margin:0}
.back .head .say svg.i{width:18px;height:18px}
.back .body{display:flex;flex-direction:column;gap:14px}
.back .zh{font-family:var(--f-serif);font-weight:700;font-size:clamp(28px,8vw,36px);line-height:1.4;color:var(--ink-solid);display:block}
.back .pos{display:inline-block;font-family:var(--f-en);font-style:italic;color:var(--green);font-size:15px;letter-spacing:0;margin-bottom:2px}
.back .ex{font-family:var(--f-en);font-size:18px;line-height:1.7;text-align:left;background:var(--soft);border:0;padding:14px 16px;border-radius:16px;color:var(--ink);display:block;min-height:0;letter-spacing:0}
.ex mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:4px;font-weight:700}
.back .exhint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:-6px}
.progress{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;letter-spacing:.06em}
.progress b{font-size:22px;font-weight:500;color:var(--ink-solid)}
.progress .bar{flex:1}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer button{min-height:54px;font-weight:700;font-size:16px}
.answer .again{border-color:var(--line);color:var(--ink-solid)}
.answer .good{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tog{min-height:36px;padding:4px 14px;font-size:14px;border-color:var(--line);color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink-solid);color:var(--bg);border-color:var(--ink-solid)}
/* card wall */
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wall .fc,.wall .face{border-radius:18px}
.wall .face{min-height:210px;box-shadow:none}
.wall .front{padding:32px 10px 32px;gap:4px}
.wall .en{font-size:clamp(20px,6vw,26px)}
.wall .kk{font-size:14px}
.wall .say{width:38px;height:38px;margin-top:4px}
.wall .say svg.i{width:18px;height:18px}
.wall .back{padding:14px 12px 30px;gap:8px}
.wall .back .head{padding-bottom:6px}
.wall .back .head .w{font-size:14px}
.wall .back .head .say{width:30px;height:30px}
.wall .back .head .say svg.i{width:14px;height:14px}
.wall .back .body{gap:8px}
.wall .back .zh{font-size:19px}
.wall .back .pos{font-size:12px}
.wall .back .ex{font-size:12.5px;line-height:1.55;padding:8px 10px;border-radius:10px}
.wall .back .exhint{display:none}
.wall .corner{top:10px;left:12px;font-size:11px}
.wall .known{top:8px;right:8px;font-size:11px;padding:0 8px}
.wall .turn{bottom:8px;right:12px;font-size:11px}
@media (max-width:360px){.wall{grid-template-columns:1fr}}

/* scan + edit */
.drop{border:1px dashed var(--muted);border-radius:24px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;width:100%}
.thumbs div{position:relative}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.thumbs button{position:absolute;top:4px;right:4px;min-height:28px;width:28px;padding:0;border-radius:50%;font-size:13px;border-color:var(--line)}
input[type=text],input[type=password],textarea{font:inherit;letter-spacing:0;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink-solid);min-width:0}
textarea{resize:vertical;min-height:58px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ed{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);box-shadow:none}
.ed .g{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.ed .g3{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.ed .num{font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.1em}
.status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--soft)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{padding:12px 16px;border-radius:14px;background:var(--soft);font-size:14px}
.notice.err{color:var(--danger)}
details{border-top:1px solid var(--line);padding-top:12px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:36px 20px;border-radius:32px;background:var(--soft);box-shadow:none}
.done .score{font-family:var(--f-num);font-size:56px;font-weight:500;line-height:1;color:var(--ink-solid)}
.done .score small{font-size:22px;color:var(--muted)}
</style>

<div class="wrap" id="app">
  <header>
    <button class="brand" id="homeBtn" aria-label="回到首頁"><span class="mark">Aa</span>拍照單字卡</button>
    <span class="ver" id="verTag"></span>
  </header>
  <main id="view"><div class="status"><div class="spin"></div>載入中…</div></main>
  <details id="changelog">
    <summary>版本紀錄</summary>
    <ul id="clList"></ul>
  </details>
</div>

<script>
const VERSION = "v2.0";
const CHANGELOG = [
  ["v2.0","2026-11-22","不用登入 Claude 也能用：部署到 Vercel，拍照辨識改由伺服器呼叫 OpenAI（金鑰藏在伺服器端，加通關密碼防盜用），單字卡存在手機瀏覽器裡；配色與排版改成白底、明朝體標題、綠色圓角按鈕的清爽風格；每個單字都是可翻轉的卡片（正面英文＋音標，背面中文、詞性、例句）；單字表改成可逐張翻轉的卡片牆；練習時可選先看哪一面"],
  ["v1.0","2026-11-22","第一版：拍課本單字頁自動變成單字卡、點英文唸發音、翻卡練習（記住了／還不熟）、單字表、手動編輯、內建 Lesson 5 範例"],
];
const ICON_SPEAK = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
const ICON_TURN = `<svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>`;
const ICON_CAM = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;

/* ---------- demo deck (transcribed from the sample textbook photo) ---------- */
const DEMO = {id:"demo",title:"範例：Lesson 5 單字（p.129）",demo:true,cards:[
 ["tour","n.","旅遊行程","[tʊr]","We plan to join the local tour in Bangkok.","tour"],
 ["spend / spent","v.","花費（金錢；時間）","[spɛnd] / [spɛnt]","Maggie spent half an hour walking to the bakery.","spent"],
 ["thousand","n.","千","[ˋθaʊzn̩d；ˋθaʊzənd]","Ivy spent two thousand NT dollars on the coat.","thousand"],
 ["each","adj.; pron.","每個（的）","[itʃ]","Each child can get a toy car for free.","Each"],
 ["pay / paid","v.","付錢","[pe] / [ped]","I paid one thousand NT dollars for this cellphone.","paid"],
 ["tomorrow","adv.; n.","明天","[təˋmɑro；təˋmɔro]","Mandy and I are going to visit Mr. Jones tomorrow.","tomorrow"],
 ["almost","adv.","幾乎","[ˋɔl͵most]","It was almost two o'clock when Eric left.","almost"],
 ["decide","v.","決定","[dɪˋsaɪd]","It was raining then, so we decided to stay at the hotel.","decided"],
 ["cost / cost","v.","花費（金錢）","[kɔst]","It cost me five thousand NT dollars to buy the guitar.","cost"],
 ["fan","n.","……迷；電扇","[fæn]","Terry is a big fan of baseball.","fan"],
 ["leave for","phr.","前往","[ˋliv fɔr]","Jenny and Paul are going to leave for Tokyo tomorrow.","leave for"],
 ["vendor","n.","攤販","[ˋvɛndɚ]","There are some flower vendors outside the temple.","vendors"],
 ["quick","adj.","迅速的","[kwɪk]","I tried to catch her, but she was too quick for me.","quick"],
 ["stall","n.","攤位","[stɔl]","Jason runs a fruit stall in the market.","stall"],
 ["careful","adj.","小心的","[ˋkɛrfəl]","Be careful! There is a car behind you.","careful"],
 ["boat","n.","小船","[bot]","Mr. Simpson has two fishing boats.","boats"],
 ["sell / sold","v.","賣；出售","[sɛl] / [sold]","I sold my bag to Jamie for NT$100.","sold"],
 ["low","adj.","低的；矮的","[lo]","Our office is in a low building.","low"],
 ["price","n.","價格；代價","[praɪs]","Bill sold his house at a high price.","price"],
 ["remember","v.","記得","[rɪˋmɛmbɚ]","Remember to send me a message when you get home.","Remember"],
 ["cash","n.","現金","[kæʃ]","Do you have any cash on you?","cash"],
 ["wonderful","adj.","美好的","[ˋwʌndɚfəl]","We had a wonderful time in Penghu this summer.","wonderful"],
].map(([en,pos,zh,ipa,example,hl],i)=>({id:"d"+i,en,pos,zh,ipa,example,hl,known:false}))};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const hlOf = c => c.hl || c.en.split("/")[0].trim();
function markEx(ex,hl){
  const t = esc(ex); if(!hl) return t;
  try{ return t.replace(new RegExp("\\b("+reEsc(esc(hl))+")\\b","i"),"<mark>$1</mark>") }catch(e){ return t }
}
const blankCard = () => ({id:uid(),en:"",pos:"",zh:"",ipa:"",example:"",hl:"",known:false});

/* ---------- speech (browser built-in) ---------- */
const prefs = Object.assign({rate:0.85, autoSpeak:true}, lsGet("wc_prefs",{}));
let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, el, rate){
  if(!("speechSynthesis" in window)){ toast("這台裝置的瀏覽器不支援朗讀"); return; }
  const say = String(text).replace(/\s*\/\s*/g,", ").replace(/……|\.\.\./g," ");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.lang = "en-US"; if(voice) u.voice = voice; u.rate = rate || prefs.rate;
  if(el){ el.classList.add("speaking"); u.onend = u.onerror = () => el.classList.remove("speaking"); }
  speechSynthesis.speak(u);
}
let toastT;
function toast(msg){
  let t = $("#toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status");
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink-solid);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw";
    document.body.appendChild(t); }
  t.textContent = msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200);
}

/* ---------- storage ---------- */
let db=null, userId=null, sample=null, sampleImages=false;
/* 不在 Claude 裡時，改用自己的伺服器（Vercel 上的 /api/scan，OpenAI 金鑰放在伺服器端） */
let server={ok:false, needsPasscode:false};
const getPass=()=>lsGet("wc_pass","");
async function checkServer(){
  if(location.protocol==="file:") return;
  try{ const r=await fetch("api/scan",{method:"GET"}); if(r.ok){ const j=await r.json(); server={ok:!!j.ok, needsPasscode:!!j.needsPasscode}; } }catch(e){}
}
async function recognize(blob, signal){
  if(sample && sampleImages) return await sample.json(PROMPT,{images:[blob],signal,modelTier:"default"});
  const image = await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
  let r;
  try{ r=await fetch("api/scan",{method:"POST",signal,headers:{"content-type":"application/json","x-app-passcode":getPass()},body:JSON.stringify({image})}); }
  catch(e){ throw {code: e?.name==="AbortError"?"cancelled":"network"}; }
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ lsSet("wc_pass",""); throw {code:"bad_passcode"}; }
  if(!r.ok) throw {code:j.code||"server", message:j.error};
  return j;
}
const store = {
  mode:"local",
  async load(){
    if(db && userId){
      try{
        const snap = await db.collection("data/users/"+userId+"/decks").get();
        this.mode="cloud";
        return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      }catch(e){ console.warn("db load failed",e); }
    }
    this.mode="local";
    return lsGet("wc_decks",[]);
  },
  queue:Promise.resolve(),
  save(deck){
    if(deck.demo){ lsSet("wc_demo_known", deck.cards.filter(c=>c.known).map(c=>c.id)); return; }
    deck.updatedAt = Date.now();
    if(this.mode==="cloud"){
      const {id,...body} = deck;
      this.queue = this.queue.then(()=>db.doc("data/users/"+userId+"/decks/"+id).set(JSON.parse(JSON.stringify(body)))).catch(e=>{console.warn(e);toast("儲存失敗，請稍後再試")});
    } else lsSet("wc_decks", state.decks);
  },
  remove(id){
    if(this.mode==="cloud") this.queue = this.queue.then(()=>db.doc("data/users/"+userId+"/decks/"+id).delete()).catch(e=>console.warn(e));
    else lsSet("wc_decks", state.decks);
  }
};

async function shrink(file){
  const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const max=2000, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
}

const PROMPT = `這是一張台灣國中英語課本「單字表」頁面的照片。請把頁面上每一個單字條目整理成 JSON。

每個條目通常有：編號、英文單字（可能有變化形，例如 "spend / spent"）、詞性縮寫（n. v. adj. adv. pron. prep. 等）、繁體中文意思、KK 音標（在方括號裡）、一句英文例句（例句中該單字常以不同顏色標示）。

規則：
- en：照課本原樣，保留 " / " 的變化形。片語（如 "leave for"）也算一個條目。
- pos：照課本的詞性縮寫；片語沒有詞性就填 "phr."。
- zh：照課本的繁體中文意思，不要自己翻譯。
- ipa：照課本音標原樣，含方括號，例如 "[spɛnd] / [spɛnt]"。看不清楚就填空字串。
- example：完整英文例句。若有兩句，只取第一句。若被手指或頁緣遮住一小段，依上下文補上最可能的字。
- hl：例句中對應這個單字的那個字（照例句裡的寫法，例如 "spent"、"boats"）。
- 只收這一頁主要的單字條目，依編號順序；忽略照片邊緣被切掉的隔壁頁。
- title：若看得到課名或頁碼，寫成像 "Lesson 5 單字（p.129）"；看不到就寫 "新的單字"。

只回傳 JSON，不要其他文字，格式：
{"title":"...","cards":[{"en":"","pos":"","zh":"","ipa":"","example":"","hl":""}]}`;

async function runScan(){
  const st=$("#scanStatus"), btn=$("#go");
  if($("#pass")){ const pw=$("#pass").value.trim(); if(!pw){ st.innerHTML=`<p class="notice err">請先輸入通關密碼。</p>`; return; } lsSet("wc_pass",pw); }
  btn.disabled=true; scanCtl=new AbortController();
  const found=[]; let title="";
  try{
    for(let i=0;i<scanFiles.length;i++){
      st.innerHTML=`<div class="status"><div class="spin"></div><div class="grow">正在讀第 ${i+1}/${scanFiles.length} 張照片…（通常要 20–60 秒）</div><button id="stopScan">停止</button></div>`;
      $("#stopScan").onclick=()=>scanCtl.abort();
      const blob=await shrink(scanFiles[i].file);
      const out=await recognize(blob, scanCtl.signal);
      if(out && Array.isArray(out.cards)){
        if(!title && out.title && out.title!=="新的單字") title=out.title;
        for(const c of out.cards){
          if(!c || !String(c.en||"").trim()) continue;
          if(found.some(x=>x.en.toLowerCase()===String(c.en).trim().toLowerCase())) continue;
          found.push({id:uid(),en:String(c.en).trim(),pos:String(c.pos||""),zh:String(c.zh||""),ipa:String(c.ipa||""),example:String(c.example||""),hl:String(c.hl||""),known:false});
        }
      }
    }
    if(!found.length){ st.innerHTML=`<p class="notice err">照片裡沒有找到單字。請換一張更清楚、拍正的照片再試一次。</p>`; btn.disabled=false; return; }
    scanFiles.forEach(f=>URL.revokeObjectURL(f.url)); scanFiles=[];
    const name=$("#deckName").value.trim()||title||"新的單字";
    go("edit",{id:null,title:name,cards:found,fresh:true,fromScan:true});
  }catch(e){
    const msg={cancelled:"已停止辨識。",not_granted:"需要允許這個頁面使用 Claude 才能辨識照片。",rate_limited:"使用太頻繁了，請等一下再試。",images_unavailable:"這裡無法傳送照片。",bad_passcode:"通關密碼不對，請再輸入一次。",network:"連不上伺服器，請檢查網路。",no_key:"伺服器還沒設定 OpenAI 金鑰。",too_large:"照片太大了，請換一張。",openai:"辨識服務暫時出錯，請稍後再試。"}[e?.code]
      || (e instanceof SyntaxError ? "辨識結果的格式不對，請再試一次。" : "辨識失敗，請再試一次。");
    st.innerHTML=`<p class="notice err">${esc(msg)}</p>`; btn.disabled=false;
    if(e?.code==="bad_passcode") setTimeout(()=>{ const keep=$("#deckName")?.value; render(); if(keep) $("#deckName").value=keep; $("#scanStatus").innerHTML=`<p class="notice err">${esc(msg)}</p>`; },0);
  }
}

const sp = Object.assign({start:"en", shuffle:false, onlyNew:false}, lsGet("wc_study",{}));
if(sp.mode){ sp.start = sp.mode==="zh"?"zh":"en"; delete sp.mode; }
function renderStudy(v){
  const deck=findDeck(state.arg.id); if(!deck) return go("home");
  if(!state.arg.order){
    let pool=deck.cards.map((c,i)=>i);
    if(sp.onlyNew){ const p=pool.filter(i=>!deck.cards[i].known); if(p.length) pool=p; }
    if(sp.shuffle) for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    Object.assign(state.arg,{order:pool,pos:0,good:0,again:0});
  }
  const a=state.arg;
  if(a.pos>=a.order.length){
    const k=deck.cards.filter(c=>c.known).length;
    v.innerHTML=`<div class="done sheet">
      <div class="score">${a.good}<small> / ${a.order.length}</small></div>
      <p>這一輪記住了 ${a.good} 個，還不熟 ${a.again} 個。<br>整組已經記住 ${k} / ${deck.cards.length} 個。</p>
      <div class="row" style="justify-content:center">
        ${a.again?`<button class="primary" id="againNew">只練還不熟的</button>`:``}
        <button id="again">全部再練一次</button><button class="text" id="home2">回首頁</button>
      </div></div>`;
    $("#again").onclick=()=>{sp.onlyNew=false;lsSet("wc_study",sp);go("study",{id:deck.id});};
    $("#againNew")&&($("#againNew").onclick=()=>{sp.onlyNew=true;lsSet("wc_study",sp);go("study",{id:deck.id});});
    $("#home2").onclick=()=>go("home");
    return;
  }
  const idx=a.order[a.pos], c=deck.cards[idx];
  v.innerHTML=`
  <div class="stack">
    <div class="row"><button class="text" id="back">← ${esc(deck.title)}</button></div>
    <div class="progress"><span><b>${a.pos+1}</b> / ${a.order.length}</span><div class="bar"><i style="width:${Math.round(a.pos/a.order.length*100)}%"></i></div></div>
    ${cardHTML(c, idx+1, {flipped: sp.start==="zh", cls:"big-card"})}
    <div class="answer"><button class="again" id="no">還不熟</button><button class="good" id="yes">記住了</button></div>
    <div class="opts">
      <span class="small muted">先看</span>
      <span class="seg"><button id="sEn" aria-pressed="${sp.start==="en"}">英文面</button><button id="sZh" aria-pressed="${sp.start==="zh"}">中文面</button></span>
      <button class="tog" id="shuf" aria-pressed="${sp.shuffle}">隨機順序</button>
      <button class="tog" id="auto" aria-pressed="${prefs.autoSpeak}">自動發音</button>
    </div>
  </div>`;
  const fc=v.querySelector(".fc");
  wireCard(fc, c, flipped=>{ if(prefs.autoSpeak && sp.start==="zh" && !flipped) speak(c.en); });
  $("#back").onclick=()=>go("home");
  const next=(known)=>{ c.known=known; known?a.good++:a.again++; a.pos++; saveSoon(deck); render(); };
  $("#no").onclick=()=>next(false); $("#yes").onclick=()=>next(true);
  const reset=()=>{delete a.order; render();};
  $("#sEn").onclick=()=>{sp.start="en";lsSet("wc_study",sp);render();};
  $("#sZh").onclick=()=>{sp.start="zh";lsSet("wc_study",sp);render();};
  $("#shuf").onclick=()=>{sp.shuffle=!sp.shuffle;lsSet("wc_study",sp);reset();};
  $("#auto").onclick=()=>{prefs.autoSpeak=!prefs.autoSpeak;lsSet("wc_prefs",prefs);render();};
  if(sp.start==="en" && prefs.autoSpeak && a.pos>0) speak(c.en, fc.querySelector(".front .say"));
}

/* ---------- card wall ---------- */
function renderList(v){
  const deck=findDeck(state.arg.id); if(!deck) return go("home");
  v.innerHTML=`
  <div class="stack">
    <div class="row"><button class="text" id="back">← 返回</button><span class="grow"></span><button class="primary" id="st">開始練習</button></div>
    <h2>${esc(deck.title)}</h2>
    <div class="row small muted"><span class="grow">點卡片翻面，點喇叭聽發音。</span><button class="text small" id="allBack">全部翻到中文</button></div>
    <div class="wall">${deck.cards.map((c,i)=>cardHTML(c,i+1)).join("")}</div>
  </div>`;
  $("#back").onclick=()=>go("home");
  $("#st").onclick=()=>go("study",{id:deck.id});
  const cards=[...v.querySelectorAll(".fc")];
  cards.forEach((el,i)=>wireCard(el, deck.cards[i]));
  const ab=$("#allBack");
  ab.onclick=()=>{ const toBack=ab.dataset.s!=="1"; cards.forEach(el=>el.classList.toggle("flipped",toBack)); ab.dataset.s=toBack?"1":"0"; ab.textContent=toBack?"全部翻到英文":"全部翻到中文"; };
}

/* ---------- boot ---------- */
$("#homeBtn").onclick=()=>go("home");
$("#verTag").textContent=VERSION;
$("#clList").innerHTML=CHANGELOG.map(([v,d,t])=>`<li><b>${esc(v)}</b>（${esc(d)}）${esc(t)}</li>`).join("");

(async function boot(){
  if(window.claude?.use){
    const timeout = new Promise(r=>setTimeout(()=>r(null),10000));
    const [s,d,u] = await Promise.all(["sample","db","user"].map(n=>Promise.race([window.claude.use(n).catch(()=>null),timeout])));
    sample=s; db=d;
    if(u){ try{ userId=await u.id(); }catch(e){} }
    if(sample){ try{ const lim=await sample.limits(); sampleImages=!!lim?.images; }catch(e){} }
  }
  if(!(sample && sampleImages)) await checkServer();
  state.decks = await store.load();
  render();
})();
</script>
